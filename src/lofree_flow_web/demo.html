<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofree Flow viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#f3f3f5;color:#222}
 header{padding:16px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
 select{font:inherit;padding:6px 10px;border-radius:8px}
 model-viewer{width:100%;height:70vh;background:radial-gradient(#fff,#e4e4e8)}
 #sw{display:flex;gap:10px;padding:0 20px 20px}
 #sw button{width:44px;height:44px;border-radius:50%;border:2px solid #0003;cursor:pointer}
 #sw button[aria-pressed=true]{outline:3px solid #2563eb;outline-offset:2px}
 #info{padding:0 20px 20px;font-size:14px;opacity:.7}
</style></head><body>
<header><label>Model <select id="model"></select></label><strong id="vname"></strong></header>
<model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" exposure="1.1"
  camera-orbit="25deg 60deg auto" alt="Lofree Flow keyboard"></model-viewer>
<div id="sw"></div><div id="info"></div>

bc_slot", "mode_switch", "volume_roller", "feet", "keycaps_alpha", "keycaps_mod", "keycaps_accent", "homing_bumps", "legends", "brand_text"], "variants": [{"name": "Off-White", "id": "off_white", "swatch": "#f6f5f0"}, {"name": "Marble", "id": "marble", "swatch": "#e9ecee"}, {"name": "Flamingo", "id": "flamingo", "swatch": "#fae2e7"}]}, "flow_lite2_84": {"file": "models/flow_lite2_84.glb", "sizeKB": 722, "widthMM": 316.8, "heightMM": 23.5, "depthMM": 138.9, "triangles": 41812, "parts": ["case", "key_well", "usbc_rim", "usbc_slot", "mode_switch", "display_bezel", "display_screen", "volume_roller", "feet", "keycaps_alpha", "keycaps_mod", "keycaps_accent", "homing_bumps", "legends", "brand_text"], "variants": [{"name": "Black", "id": "black", "swatch": "#6c6d72"}, {"name": "White", "id": "white", "swatch": "#f9f9f7"}]}, "flow_lite2_100": {"file": "models/flow_lite2_100.glb", "sizeKB": 828, "widthMM": 374.5, "heightMM": 23.5, "depthMM": 138.9, "triangles": 48292, "parts": ["case", "key_well", "usbc_rim", "usbc_slot", "mode_switch", "display_bezel", "display_screen", "volume_roller", "feet", "keycaps_alpha", "keycaps_mod", "keycaps_accent", "homing_bumps", "legends", "brand_text"], "variants": [{"name": "Black", "id": "black", "swatch": "#6c6d72"}, {"name": "White", "id": "white", "swatch": "#f9f9f7"}]}};
const mv=document.getElementById('mv'), sel=document.getElementById('model'), sw=document.getElementById('sw');
for (const k in MANIFEST) sel.add(new Option(k.replace(/_/g,' '), k));
function swatches(m){
  sw.innerHTML='';
  m.variants.forEach(v=>{const b=document.createElement('button');b.style.background=v.swatch;b.title=v.name;
    b.onclick=()=>{mv.variantName=v.name;document.getElementById('vname').textContent=v.name;
      [...sw.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};sw.append(b)});
}
function load(k){
  const m=MANIFEST[k]; mv.src=m.file; swatches(m);
  document.getElementById('info').textContent=`${m.widthMM} x ${m.depthMM} x ${m.heightMM} mm - ${m.triangles.toLocaleString()} triangles - ${m.sizeKB} KB`;
  mv.addEventListener('load',()=>{sw.firstChild.click()},{once:true});
}
sel.onchange=()=>load(sel.value); load(sel.value);
</script></body></html>
